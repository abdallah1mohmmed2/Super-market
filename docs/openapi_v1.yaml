  "components": {
    "securitySchemes": {
      "FirebaseBearer": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "Firebase ID token (RS256)"
      }
    },
    "schemas": {
      "PageMeta": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "page": {
            "type": "integer",
            "minimum": 1
          },
          "limit": {
            "type": "integer",
            "minimum": 1,
            "maximum": 30
          },
          "nextCursor": {
            "type": "string",
            "nullable": true
          },
          "requestId": {
            "type": "string"
          }
        },
        "required": [
          "page",
          "limit",
          "nextCursor",
          "requestId"
        ]
      },
      "ApiError": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "error": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "requestId": {
                "type": "string"
              }
            },
            "required": [
              "code",
              "message",
              "requestId"
            ]
          }
        },
        "required": [
          "error"
        ]
      },
      "ProductUnitBarcodeDto": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "unitName": {
            "type": "string",
            "minLength": 1,
            "maxLength": 30
          },
          "conversionFactor": {
            "type": "number",
            "exclusiveMinimum": true,
            "minimum": 0,
            "maximum": 1000000
          },
          "barcode": {
            "type": "string",
            "nullable": true,
            "pattern": "^\\d{8,14}$"
          },
          "retailPrice": {
            "type": "string",
            "pattern": "^(0|[1-9][0-9]{0,12})\\.[0-9]{2}$",
            "example": "150.00"
          },
          "wholesalePrice": {
            "type": "string",
            "pattern": "^(0|[1-9][0-9]{0,12})\\.[0-9]{2}$",
            "example": "150.00"
          },
          "costPrice": {
            "type": "string",
            "pattern": "^(0|[1-9][0-9]{0,12})\\.[0-9]{2}$",
            "example": "150.00"
          }
        },
        "required": [
          "id",
          "unitName",
          "conversionFactor",
          "barcode",
          "retailPrice",
          "wholesalePrice",
          "costPrice"
        ]
      },
      "ProductDto": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "branchId": {
            "type": "string",
            "format": "uuid"
          },
          "code": {
            "type": "string",
            "minLength": 1,
            "maxLength": 40
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 160
          },
          "baseUnit": {
            "type": "string",
            "minLength": 1,
            "maxLength": 30
          },
          "isWeighted": {
            "type": "boolean"
          },
          "scalePluCode": {
            "type": "string",
            "nullable": true,
            "pattern": "^\\d{4}$"
          },
          "categoryId": {
            "type": "string",
            "format": "uuid",
            "nullable": true
          },
          "units": {
            "type": "array",
            "minItems": 1,
            "maxItems": 30,
            "items": {
              "$ref": "#/components/schemas/ProductUnitBarcodeDto"
            }
          },
          "stockBaseQty": {
            "type": "number",
            "minimum": 0,
            "description": "Server-owned. Creation always returns zero; definition edits preserve the authoritative quantity."
          },
          "revision": {
            "type": "integer",
